<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Size a walk-in vegie cage: mesh fence, poly hoops, net cover, and a metre-exact cut list." />
    <meta name="theme-color" content="#12180f" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var t = 'auto'
        try {
          var stored = localStorage.getItem('vegie-cage-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'auto') t = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t)
        var dark =
          t === 'dark' ||
          (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
    <title>Vegie Cage — hoop + mesh planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
